name: Release checksums

# When a GitHub Release is published, attach the built single-file application
# and a SHA256SUMS file. The HTML file is built from source and must be
# byte-identical to the committed site/index.html (verified by the tests).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and verify
        run: |
          cp site/index.html /tmp/committed.html
          python source/build.py
          cmp site/index.html /tmp/committed.html
      - name: Prepare assets
        run: |
          mkdir dist
          cp site/index.html "dist/mathcrypt-${GITHUB_REF_NAME#v}.html"
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
